<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <title>Arctic Badge</title>
    <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
    <button id="telegram-btn" aria-label="Open Telegram info">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
        </svg>
    </button>

    <div id="telegram-overlay">
        <div id="telegram-overlay-content">
            <button id="telegram-close" aria-label="Close overlay">&times;</button>
            <img id="telegram-image" src="images/telegram-preview.jpg" alt="Telegram preview"/>
            <h2 id="telegram-title">Add me on Telegram!</h2>
        </div>
    </div>

    <div id="heading">
        <h1>Arctic</h1>
        <p id="subtitle">The Barn Owl</p>
    </div>
    
    <div id="image-container">
        <img id="main-image" src="images/image1.jpg" alt="Full screen image" draggable="false"/>
        <div id="stars-burst"></div>
        <img id="emote" src="images/emote.png" alt="Emote" draggable="false"/>
    </div>
    
    <div id="click-counter" class="pulse">
        <span id="counter-label">Hold to Pet</span>
        <span id="counter-value" style="display: none;">0</span>
    </div>
    
    <button id="hold-btn" aria-label="Toggle hold click">🖱️</button>

    <a id="gambling-btn" href="gambling/slot-machine.html" aria-label="Slot Machine">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <line x1="8" y1="4" x2="8" y2="20"/>
            <line x1="16" y1="4" x2="16" y2="20"/>
            <text x="5" y="14" font-size="8" fill="currentColor" stroke="none">🎰</text>
        </svg>
        <span>🎰</span>
    </a>

    <button id="fullscreen-btn" aria-label="Toggle fullscreen">
        <svg id="enter-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
        <svg id="exit-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
        </svg>
    </button>
    
    <script src="js/script.js"></script>


</body></html>
